name: Mod Release (reusable)

on:
  workflow_call:
    inputs:
      mod_id:
        required: true
        type: string
      tag_name:
        required: true
        type: string
      published_file_id:
        required: false
        type: string
        default: ''
      publish_steam:
        required: false
        type: boolean
        default: false
      prerelease:
        required: false
        type: boolean
        default: false
      preview_file:
        required: false
        type: string
        default: 'preview.png'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync mod.info version to release tag
        run: |
          version="${{ inputs.tag_name }}"
          version="${version#v}"
          mod_info="Contents/mods/${{ inputs.mod_id }}/common/mod.info"
          # PZ's mod.info parser does not tolerate a trailing marker comment
          # after modversion= (confirmed in-game 2026-07-28), so release-please
          # never touches this file directly — this is the only place the
          # shipped modversion gets synced to the real release version.
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] && [ -f "$mod_info" ]; then
            sed -i "s/^modversion=.*/modversion=$version/" "$mod_info"
            echo "Set modversion=$version in $mod_info"
          else
            echo "Skipping modversion sync (tag '$version' isn't plain semver, or $mod_info not found)"
          fi

      - name: Zip mod folder
        run: |
          mkdir -p release_build
          zip -r "release_build/${{ inputs.mod_id }}.zip" Contents/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: release_build/${{ inputs.mod_id }}.zip
          generate_release_notes: false
          prerelease: ${{ inputs.prerelease }}

      - name: Verify Steam Workshop item exists
        if: ${{ inputs.publish_steam == true }}
        run: |
          id="${{ inputs.published_file_id }}"
          if ! [[ "$id" =~ ^[0-9]+$ ]]; then
            echo "::error::published_file_id '$id' is not a numeric Workshop ID (placeholder never replaced?)"
            exit 1
          fi
          result=$(curl -s -X POST "https://api.steampowered.com/ISteamRemoteStorage/GetPublishedFileDetails/v1/" \
            -d "itemcount=1&publishedfileids[0]=$id" \
            | jq -r '.response.publishedfiledetails[0].result')
          if [ "$result" != "1" ]; then
            echo "::error::Workshop item $id does not exist (Steam API result=$result). First publish is always manual via Steam's own tools."
            exit 1
          fi
          echo "Workshop item $id confirmed to exist."

      - name: Publish to Steam Workshop
        if: ${{ inputs.publish_steam == true }}
        uses: lucashort7/steam-workshop-deploy@v1
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: '108600'
          publishedFileId: ${{ inputs.published_file_id }}
          path: '.'
          previewFile: ${{ inputs.preview_file }}
          changeNote: 'Automatically updated via GitHub Actions (${{ inputs.tag_name }}, build ${{ github.run_number }})'
